name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 为什么钉 ubuntu-24.04 而不是 ubuntu-latest：
        # `ubuntu-latest` 自 2026-10-19 起开始迁移到 Ubuntu 26
        # （actions/runner-images#14748）。本项目的测试会真实派生子进程、
        # 反复建删临时目录、并探测系统路径（rmTemp 的 EBUSY 重试、
        # cloudflared 候选目录、Python 探测），底层 libc 与默认工具链换一版
        # 就可能让这些断言变红 —— 那种红是**环境噪音**，不是产品回归，
        # 排查成本却和真 bug 一样高。钉住版本让 CI 只在代码变化时变红。
        # 等本仓库在 Ubuntu 26 上手动验证过（或 Actions 废弃 24.04 镜像）
        # 再改这一行。
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # 必须与 package.json 的 engines.node (>=24) 一致。
          # DSH 0.2.1-rc.1 自带 Node 24.21.0；CI 若仍用 22，
          # 测出来的环境就和用户真实运行环境不是一回事。
          node-version: 24

      - name: Install dependencies
        run: npm install --no-save --no-package-lock @deepseek-ai/schemastery@3.18.4

      - name: Build client bundle
        run: node client/build.mjs

      - name: Host-side control checks
        run: node --test test/host.test.mjs

      - name: Client distribution contract checks
        run: node --test test/client.test.mjs

      - name: Manifest contract checks
        # 清单字段的静态契约（engines.dsh / manifestVersion / 图标 / exports）。
        # 门禁组需要宿主运行时，CI 里没有 DSH，会明确 skip —— 这是设计，不是失败。
        run: node --test test/manifest.test.mjs

      - name: Host contract checks
        # 槽位目录 / stdout 纪律 / core 依赖对账。需要宿主运行时的项在 CI 里
        # 明确 skip（没有 DSH）；stdout 纪律与"检测器自身有效"两条**必须真跑**，
        # 它们不依赖宿主 —— 这两条才是 CI 能拦住的那部分。
        run: node --test test/host-contract.test.mjs

      - name: Portal readiness ordering
        # 「端口在听」与「runs/portal_state.json 可读」之间不得有窗口。
        # 这条**必须在 CI 里跑**：它在 macOS 上窗口只有 5–17ms、本地怎么跑都绿，
        # 而 CI 的 Windows 文件写入慢一个数量级，窗口被放大后才暴露成
        # `Cannot read properties of null (reading 'running')`。
        # 检验本身把隧道阶段稳定拖到一分钟量级，把窗口放大成**必然**失败，
        # 所以在任何平台都能稳定判出回归，不再依赖"偶发"。
        run: python -X utf8 tools/check_state_ready_before_tunnel.py

      - name: Verify package contents
        run: npm pack --dry-run