# dsh-poker-viewer bundle patch.
#
# 把 ld-rl-poker 训练配置台/模型查看台的外网开关接入 DSH host plane。
#
# 本插件是 **启动器**，不是第二份实现：
#   隧道 + 随机口令认证代理由 ld-rl-poker 仓库里已验收的实现承担
#   （tools/start_public_gui.py + tools/tunnel_auth.py，35 项控制检验通过）。
#   插件只负责：启停那个脚本 → 读它的凭据 JSON → 在设置页显示连接与口令。
#
# 依赖宿主 webServer：插件在 apply() 里用 ctx.inject(["webServer"]) 软挂载，
# 注册 /poker-viewer/api 前缀路由（状态/启停/口令）与 /poker-viewer 前端。
# headless 组合下 webServer 不存在，插件保持 fail-closed，不宣称 Web 能力就绪。
- insert:
    - id: dsh-poker-viewer
      name: dsh-poker-viewer
