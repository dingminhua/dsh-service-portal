description:
  en: Exposes local services to the public internet on demand via a random cloudflared domain plus a Basic Auth random password, with host metrics and control checks.
  zh: 一个随机域名加一个随机口令，把本机服务按需开放到外网（cloudflared 隧道 + Basic Auth 认证代理），附带机器状态采集与控制检验。
