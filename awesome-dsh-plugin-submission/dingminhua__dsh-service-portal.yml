description:
  en: Exposes local services through both LAN and a public cloudflared tunnel, guarded by a password login (random or fixed) and managed from a built-in web console.
  zh: 内网加外网两种入口，一个口令登录（可随机可固定）把本机服务按需开放到外网，自带网页控制台管理服务与路由。
